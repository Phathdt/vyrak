# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,tsx}'
      run: pnpm ci:lint {staged_files}
    format:
      glob: '*.{ts,tsx}'
      run: pnpm ci:format {staged_files}
    stage-changes:
      run: git add {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm ci:typecheck
    test:
      run: pnpm test:unit
