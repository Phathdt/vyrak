# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,tsx}'
      run: yarn ci:lint {staged_files}
    format:
      glob: '*.{ts,tsx}'
      run: yarn ci:format {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: yarn ci:typecheck
    test:
      run: yarn test:unit
