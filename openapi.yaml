info:
  title: Vyrak API
  description: Vyrak API documentation
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        expiresIn:
          type: number
          description: Token expiry time in seconds
        user:
          type: object
          description: User information
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
              nullable: true
      required:
        - accessToken
        - expiresIn
        - user
    CurrentUserResponseDto:
      type: object
      properties:
        user:
          x-nestjs_zod-uses-3-point-1-syntax: true
          x-nestjs_zod-empty-type: true
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            image:
              type: string
              nullable: true
          type: object
          required:
            - id
            - name
            - email
            - image
        organizations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              slug:
                type: string
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - member
          x-nestjs_zod-uses-3-point-1-syntax: true
      required:
        - user
        - organizations
    CreateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Acme Inc
          description: Organization name
        slug:
          type: string
          minLength: 3
          maxLength: 50
          pattern: ^[a-z0-9-]+$
          example: acme-inc
          description: Unique organization slug (lowercase, alphanumeric, hyphens only)
        logo:
          type: string
          format: uri
          example: https://example.com/logo.png
          description: Organization logo URL
      required:
        - name
        - slug
    OrganizationResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Organization ID
        name:
          type: string
          example: Acme Inc
          description: Organization name
        slug:
          type: string
          example: acme-inc
          description: Organization slug
        logo:
          type: string
          example: https://example.com/logo.png
          description: Organization logo URL
          nullable: true
        role:
          type: string
          example: owner
          description: Current user role in organization
          enum:
            - owner
            - admin
            - member
        memberCount:
          type: number
          example: 5
          description: Number of members
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        updatedAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Last update timestamp
      required:
        - id
        - name
        - slug
        - role
        - memberCount
        - createdAt
        - updatedAt
    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Acme Corporation
          description: Organization name
        logo:
          type: string
          format: uri
          example: https://example.com/logo.png
          description: Organization logo URL
    MemberUserResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: User ID
        name:
          type: string
          example: John Doe
          description: User name
          nullable: true
        email:
          type: string
          example: john@example.com
          description: User email
        image:
          type: string
          example: https://example.com/avatar.png
          description: User avatar URL
          nullable: true
      required:
        - id
        - email
    MemberResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Membership ID
        role:
          type: string
          example: owner
          description: Member role
          enum:
            - owner
            - admin
            - member
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Join timestamp
        user:
          $ref: '#/components/schemas/MemberUserResponse'
      required:
        - id
        - role
        - createdAt
        - user
    UpdateMemberRoleDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - owner
            - admin
            - member
          example: admin
          description: New role for the member
      required:
        - role
    InviteMemberDto:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          example: john@example.com
          description: Email address of the user to invite
        role:
          type: string
          enum:
            - admin
            - member
          example: member
          description: Role to assign to the invited user
      required:
        - email
        - role
    OrganizationSummaryResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Organization ID
        name:
          type: string
          example: Acme Inc
          description: Organization name
        slug:
          type: string
          example: acme-inc
          description: Organization slug
      required:
        - id
        - name
        - slug
    InvitationResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Invitation ID
        email:
          type: string
          example: john@example.com
          description: Invitee email
        role:
          type: string
          example: member
          description: Role to assign
          enum:
            - admin
            - member
        status:
          type: string
          example: pending
          description: Invitation status
          enum:
            - pending
            - accepted
            - rejected
            - cancelled
        expiresAt:
          format: date-time
          type: string
          example: '2026-10-26T10:00:00Z'
          description: Expiration timestamp
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        organization:
          $ref: '#/components/schemas/OrganizationSummaryResponse'
      required:
        - id
        - email
        - role
        - status
        - expiresAt
        - createdAt
    CreateProjectDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: My Project
          description: Project name
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9-]+$
          example: my-project
          description: Unique project slug within organization (lowercase, alphanumeric, hyphens only)
        description:
          type: string
          maxLength: 500
          example: This is my project description
          description: Project description
      required:
        - name
        - slug
    ProjectStats:
      type: object
      properties:
        repositoryCount:
          type: number
          example: 5
          description: Number of repositories
        workflowRunCount:
          type: number
          example: 12
          description: Number of workflow runs
      required:
        - repositoryCount
        - workflowRunCount
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Project ID
        organizationId:
          type: string
          example: uuid-org
          description: Organization ID
        name:
          type: string
          example: My Project
          description: Project name
        slug:
          type: string
          example: my-project
          description: Project slug
        description:
          type: string
          example: Project description
          description: Project description
          nullable: true
        stats:
          description: Project statistics
          allOf:
            - $ref: '#/components/schemas/ProjectStats'
        createdAt:
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        updatedAt:
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Last update timestamp
      required:
        - id
        - organizationId
        - name
        - slug
        - stats
        - createdAt
        - updatedAt
    PaginatedProjectsResponse:
      type: object
      properties:
        items:
          description: List of projects
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        total:
          type: number
          example: 100
          description: Total number of projects
        page:
          type: number
          example: 1
          description: Current page number
        limit:
          type: number
          example: 10
          description: Items per page
        totalPages:
          type: number
          example: 10
          description: Total number of pages
      required:
        - items
        - total
        - page
        - limit
        - totalPages
    GitRepositoryResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Repository ID
        projectId:
          type: string
          example: uuid-project
          description: Project ID
        organizationId:
          type: string
          example: uuid-org
          description: Organization ID
        name:
          type: string
          example: backend-api
          description: Repository display name
        url:
          type: string
          example: https://github.com/acme/backend-api
          description: Clone URL
        branch:
          type: string
          example: main
          description: Default branch
        provider:
          type: string
          example: github
          description: Git provider
        status:
          type: string
          example: active
          description: Repository status
        createdAt:
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        updatedAt:
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Last update timestamp
      required:
        - id
        - projectId
        - organizationId
        - name
        - url
        - branch
        - provider
        - status
        - createdAt
        - updatedAt
    GitRepositoryListResponse:
      type: object
      properties:
        items:
          description: Repositories linked to the project
          type: array
          items:
            $ref: '#/components/schemas/GitRepositoryResponse'
      required:
        - items
    CreateWorkflowDto:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 5000
        type:
          type: string
          enum:
            - HOTFIX
            - STORY
            - EPIC
        repositoryIds:
          minItems: 1
          type: array
          items:
            type: string
      required:
        - title
        - type
        - repositoryIds
    WorkflowResponse:
