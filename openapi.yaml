  /api/organizations/{orgId}/projects/{projectId}/workflows/{id}/brainstorm:
    post:
      description: |-
        Start or continue a brainstorming conversation with the AI assistant to understand workflow requirements.

        The AI will ask clarifying questions to understand:
        - What needs to be built or fixed
        - Scope and complexity
        - Technical requirements
        - Timeline urgency

        After 4-5 exchanges (8+ messages), the conversation will have enough context for classification.
      operationId: WorkflowBrainstormingController_brainstorm
      parameters:
        - name: orgId
          required: true
          in: path
          description: Organization ID
          schema:
            type: string
        - name: projectId
          required: true
          in: path
          description: Project ID
          schema:
            type: string
        - name: id
          required: true
          in: path
          description: Workflow ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrainstormRequestDto'
      responses:
        '200':
          description: AI response received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrainstormResponseDto'
        '404':
          description: Workflow not found
      summary: Brainstorm workflow with AI assistant
      tags: &ref_7
        - Workflows - Brainstorming
  /api/organizations/{orgId}/projects/{projectId}/workflows/{id}/classify:
    post:
      description: |-
        Analyze the brainstorming conversation and classify the workflow as HOTFIX, STORY, or EPIC.

        Requires at least 8 messages in the conversation (4-5 exchanges) to have enough context.

        **Classification Criteria:**
        - **HOTFIX**: <2h, single component, urgent production fixes
        - **STORY**: 1-3 days, 2-5 files, planned features
        - **EPIC**: 1+ weeks, multi-system, requires architecture design
      operationId: WorkflowBrainstormingController_classify
      parameters:
        - name: orgId
          required: true
          in: path
          description: Organization ID
          schema:
            type: string
        - name: projectId
          required: true
          in: path
          description: Project ID
          schema:
            type: string
        - name: id
          required: true
          in: path
          description: Workflow ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequestDto'
      responses:
        '200':
          description: Workflow classified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponseDto'
        '400':
          description: Not enough messages for classification
        '404':
          description: Session not found
      summary: Classify workflow based on brainstorming conversation
      tags: *ref_7
  /api/organizations/{orgId}/projects/{projectId}/workflows/{id}/confirm-classification:
    post:
      operationId: WorkflowsController_confirmClassification
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: projectId
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmClassificationDto'
      responses:
        '200':
          description: Classification confirmed and workflow activated
        '400':
          description: Can only confirm classification from BRAINSTORMING or CLASSIFICATION_PENDING
        '404':
          description: Workflow not found
      summary: Confirm workflow classification
      tags: *ref_6
  /api/organizations/{orgId}/projects/{projectId}/workflows/{id}/brainstorm-stream:
    get:
      description: |-
        Server-Sent Events endpoint for streaming AI responses in real-time.

        Each chunk of the AI response will be sent as it's generated, providing a better user experience.
      operationId: WorkflowBrainstormingController_brainstormStream
      parameters:
        - name: orgId
          required: true
          in: path
          description: Organization ID
          schema:
            type: string
        - name: projectId
          required: true
          in: path
          description: Project ID
          schema:
            type: string
        - name: id
          required: true
          in: path
          description: Workflow ID
          schema:
            type: string
        - name: userMessage
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Stream of AI response chunks
      summary: Brainstorm workflow with AI assistant (streaming)
      tags: *ref_7
info:
  title: Vyrak API
  description: Vyrak API documentation
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        expiresIn:
          type: number
          description: Token expiry time in seconds
        user:
          type: object
          description: User information
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
              nullable: true
      required:
        - accessToken
        - expiresIn
        - user
    CurrentUserResponseDto:
      type: object
      properties:
        user:
          x-nestjs_zod-uses-3-point-1-syntax: true
          x-nestjs_zod-empty-type: true
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            image:
              type: string
              nullable: true
          type: object
          required:
            - id
            - name
            - email
            - image
        organizations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              slug:
                type: string
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - member
          x-nestjs_zod-uses-3-point-1-syntax: true
      required:
        - user
        - organizations
    CreateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Acme Inc
          description: Organization name
        slug:
          type: string
          minLength: 3
          maxLength: 50
          pattern: ^[a-z0-9-]+$
          example: acme-inc
          description: Unique organization slug (lowercase, alphanumeric, hyphens only)
        logo:
          type: string
          format: uri
          example: https://example.com/logo.png
          description: Organization logo URL
      required:
        - name
        - slug
    OrganizationResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Organization ID
        name:
          type: string
          example: Acme Inc
          description: Organization name
        slug:
          type: string
          example: acme-inc
          description: Organization slug
        logo:
          type: string
          example: https://example.com/logo.png
          description: Organization logo URL
          nullable: true
        role:
          type: string
          example: owner
          description: Current user role in organization
          enum:
            - owner
            - admin
            - member
        memberCount:
          type: number
          example: 5
          description: Number of members
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        updatedAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Last update timestamp
      required:
        - id
        - name
        - slug
        - role
        - memberCount
        - createdAt
        - updatedAt
    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Acme Corporation
          description: Organization name
        logo:
          type: string
          format: uri
          example: https://example.com/logo.png
          description: Organization logo URL
    MemberUserResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: User ID
        name:
          type: string
          example: John Doe
          description: User name
          nullable: true
        email:
          type: string
          example: john@example.com
          description: User email
        image:
          type: string
          example: https://example.com/avatar.png
          description: User avatar URL
          nullable: true
      required:
        - id
        - email
    MemberResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Membership ID
        role:
          type: string
          example: owner
          description: Member role
          enum:
            - owner
            - admin
            - member
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Join timestamp
        user:
          $ref: '#/components/schemas/MemberUserResponse'
      required:
        - id
