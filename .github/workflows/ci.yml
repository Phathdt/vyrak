name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn db:generate

      - name: Build backend packages (libs + api-server)
        run: yarn turbo run build --filter='!@apps/web'

      - name: Generate API client
        run: yarn generate:api

      - name: Build frontend
        run: yarn workspace @apps/web build

      - name: Lint
        run: yarn lint:ci

      - name: Type check
        run: yarn typecheck

      - name: Run tests with coverage
        run: yarn test:ci
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyrak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn workspace @vyrak/e2e install:browsers

      - name: Build packages
        run: yarn build

      - name: Setup test database
        env:
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/vyrak_test
        run: |
          yarn db:migrate:deploy
          yarn db:seed:test

      - name: Start API server
        env:
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/vyrak_test
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: test-secret-key-for-ci
        run: |
          yarn workspace @vyrak/api-server start &
          npx wait-on http://localhost:3000/health --timeout 60000

      - name: Start web app
        env:
          VITE_API_BASE_URL: http://localhost:3000
        run: |
          yarn workspace @vyrak/web build
          yarn workspace @vyrak/web preview --port 5173 &
          npx wait-on http://localhost:5173 --timeout 60000

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:3000
          TEST_USER_EMAIL: test@example.com
          TEST_USER_PASSWORD: Test123456!
          CI: true
        run: yarn workspace @vyrak/e2e test --project=chromium

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/e2e/test-results/
          retention-days: 7
