name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyrak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/vyrak_test

      - name: Build backend packages (libs + api-server)
        run: pnpm turbo run build --filter='!@apps/web'

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test
          APP_ENV: development
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/vyrak_test
          REDIS__URL: redis://localhost:6379
          JWT__SECRET: test-secret-key-for-ci-only-do-not-use-in-production
          JWT__EXPIRY: 24h
          FRONTEND__URL: http://localhost:5173
          S3__ENDPOINT: http://localhost:4566
          S3__REGION: us-east-1
          S3__BUCKET: vyrak-artifacts
          S3__ACCESS_KEY_ID: test
          S3__SECRET_ACCESS_KEY: test
          S3__FORCE_PATH_STYLE: true
          WORKSPACE__MODE: worktree
          WORKSPACE__MAIN_REPOS_PATH: /tmp/vyrak-repos
          WORKSPACE__WORKSPACES_PATH: /tmp/vyrak-workspaces
          WORKSPACE__CLEANUP_ON_SUCCESS: true
          WORKSPACE__CLEANUP_ON_FAILURE: false
          AGENT_RUNTIME__USE_FAKE_AGENT: true
