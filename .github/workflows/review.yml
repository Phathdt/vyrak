name: Claude PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.LLM_API_KEY }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 10
            --append-system-prompt "Perform a READ-ONLY code review of the current pull request. Focus on correctness, bugs, security, race conditions, performance, and maintainability. Report only actionable findings with severity, impact, and file/line references. Do not edit files, commit, or push changes."
