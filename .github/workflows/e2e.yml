name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyrak_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Cache dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn db:generate

      - name: Run database migrations
        run: yarn db:migrate:deploy
        env:
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/vyrak_e2e

      - name: Seed E2E test data
        run: yarn db:seed:test
        env:
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/vyrak_e2e

      - name: Install Playwright browsers
        run: yarn workspace @vyrak/e2e install:browsers

      - name: Build backend packages (libs + api-server)
        run: yarn turbo run build --filter='!@apps/web'

      - name: Generate API client
        run: yarn generate:api

      - name: Build frontend
        run: yarn workspace @apps/web build

      - name: Start API server (background)
        run: |
          yarn workspace @apps/api-server start:prod &
          echo $! > api-server.pid
        env:
          NODE_ENV: production
          APP_ENV: development
          PORT: 3000
          DATABASE__URL: postgresql://postgres:postgres@localhost:5432/vyrak_e2e
          REDIS__URL: redis://localhost:6379
          JWT__SECRET: test-secret-key-for-ci-only-do-not-use-in-production
          JWT__EXPIRY: 24h
          FRONTEND__URL: http://localhost:5173
          S3__ENDPOINT: http://localhost:4566
          S3__REGION: us-east-1
          S3__BUCKET: vyrak-artifacts
          S3__ACCESS_KEY_ID: test
          S3__SECRET_ACCESS_KEY: test
          S3__FORCE_PATH_STYLE: true
          WORKSPACE__MODE: worktree
          WORKSPACE__MAIN_REPOS_PATH: /tmp/vyrak-repos
          WORKSPACE__WORKSPACES_PATH: /tmp/vyrak-workspaces
          WORKSPACE__CLEANUP_ON_SUCCESS: true
          WORKSPACE__CLEANUP_ON_FAILURE: false
          AGENT_RUNTIME__USE_FAKE_AGENT: true

      - name: Wait for API server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/health; do sleep 2; done'

      - name: Start web app (background)
        run: |
          yarn workspace @apps/web preview --port 5173 --host &
          echo $! > web-app.pid
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Wait for web app
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          CI: true
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:3000
          TEST_USER_EMAIL: test@example.com
          TEST_USER_PASSWORD: Test123456!

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/e2e/test-results/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          if [ -f api-server.pid ]; then kill $(cat api-server.pid) || true; fi
          if [ -f web-app.pid ]; then kill $(cat web-app.pid) || true; fi
