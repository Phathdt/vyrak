services:
  redis:
    image: redis:7.2-alpine
    container_name: vyrak-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16.2-alpine
    container_name: vyrak-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vyrak
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  floci:
    image: floci/floci:latest
    container_name: vyrak-floci
    ports:
      - "4566:4566" # S3-compatible API
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - floci-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailcrab:
    image: marlonb/mailcrab:latest
    container_name: vyrak-mailcrab
    ports:
      - "1080:1080" # Web interface
      - "1025:1025" # SMTP server
    restart: unless-stopped

  bullboard:
    image: deadly0/bull-board
    container_name: vyrak-bullboard
    ports:
      - "4000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      BULL_PREFIX: bull
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Application services are opt-in: `docker compose --profile app up -d --build`
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: prisma/Dockerfile
    container_name: vyrak-migrate
    environment:
      DATABASE__URL: postgresql://postgres:postgres@postgres:5432/vyrak
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: vyrak-api
    ports:
      - "3000:3000"
    environment:
      APP_ENV: development
      HOST__PORT: 3000
      DATABASE__URL: postgresql://postgres:postgres@postgres:5432/vyrak
      REDIS__URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT__SECRET: ${JWT__SECRET:-change-me-in-env-file}
      S3__ENDPOINT: http://floci:4566
      S3__ACCESS_KEY_ID: test
      S3__SECRET_ACCESS_KEY: test
      ANTHROPIC__API_KEY: ${ANTHROPIC__API_KEY:-}
      ANTHROPIC__MODEL: ${ANTHROPIC__MODEL:-}
      ANTHROPIC__API_URL: ${ANTHROPIC__API_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: vyrak-worker
    environment:
      APP_ENV: development
      HOST__PORT: 3001
      DATABASE__URL: postgresql://postgres:postgres@postgres:5432/vyrak
      REDIS__URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT__SECRET: ${JWT__SECRET:-change-me-in-env-file}
      S3__ENDPOINT: http://floci:4566
      S3__ACCESS_KEY_ID: test
      S3__SECRET_ACCESS_KEY: test
      ANTHROPIC__API_KEY: ${ANTHROPIC__API_KEY:-}
      ANTHROPIC__MODEL: ${ANTHROPIC__MODEL:-}
      ANTHROPIC__API_URL: ${ANTHROPIC__API_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   container_name: vyrak-web
  #   ports:
  #     - "80:80"
