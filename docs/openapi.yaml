          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionDto'
      responses:
        '200':
          description: Workflow approved successfully
        '400':
          description: Invalid approval state or workflow not in waiting_approval state
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - no approval permission
        '404':
          description: Workflow run not found
        '409':
          description: Approval already decided or plan has been regenerated
      security: *ref_5
      summary: Approve a pending workflow
      tags: *ref_6
  /api/workflows/runs/{runId}/reject:
    post:
