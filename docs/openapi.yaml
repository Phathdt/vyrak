  /api/organizations/{orgId}/projects:
    post:
      operationId: ProjectsController_create
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Bad request - slug already exists
      summary: Create a new project
      tags: &ref_5
        - Projects
    get:
      operationId: ProjectsController_findAll
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            minimum: 1
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Items per page
          schema:
            minimum: 1
            maximum: 100
            default: 10
            example: 10
            type: number
        - name: search
          required: false
          in: query
          description: Search by name or slug
          schema:
            example: my project
            type: string
        - name: sort
          required: false
          in: query
          description: Sort field
          schema:
            default: createdAt
            example: createdAt
            type: string
            enum:
              - name
              - createdAt
              - updatedAt
        - name: order
          required: false
          in: query
          description: Sort order
          schema:
            default: desc
            example: desc
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectsResponse'
      summary: List projects with pagination, search, and sorting
      tags: *ref_5
  /api/organizations/{orgId}/projects/{id}:
    get:
      operationId: ProjectsController_findOne
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Project not found
      summary: Get project by ID
      tags: *ref_5
    patch:
      operationId: ProjectsController_update
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDto'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Project not found
      summary: Update project
      tags: *ref_5
    delete:
      operationId: ProjectsController_remove
      parameters:
        - name: orgId
          required: true
          in: path
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Project deleted successfully
        '400':
          description: Cannot delete project with active workflow runs
        '404':
          description: Project not found
      summary: Delete project
      tags: *ref_5
info:
  title: Vyrak API
  description: Vyrak API documentation
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Development
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties: {}
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        expiresIn:
          type: number
          description: Token expiry time in seconds
        user:
          type: object
          description: User information
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
              nullable: true
      required:
        - accessToken
        - expiresIn
        - user
    CurrentUserResponseDto:
      type: object
      properties:
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
            email:
              type: string
            image:
              type: string
              nullable: true
        organizations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              slug:
                type: string
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - member
      required:
        - user
        - organizations
    CreateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          example: Acme Inc
          description: Organization name
          minLength: 1
          maxLength: 100
        slug:
          type: string
          example: acme-inc
          description: Unique organization slug (lowercase, alphanumeric, hyphens only)
          pattern: ^[a-z0-9-]+$
          minLength: 3
          maxLength: 50
        logo:
          type: string
          example: https://example.com/logo.png
          description: Organization logo URL
      required:
        - name
        - slug
    OrganizationResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Organization ID
        name:
          type: string
          example: Acme Inc
          description: Organization name
        slug:
          type: string
          example: acme-inc
          description: Organization slug
        logo:
          type: string
          example: https://example.com/logo.png
          description: Organization logo URL
          nullable: true
        role:
          type: string
          example: owner
          description: Current user role in organization
        memberCount:
          type: number
          example: 5
          description: Number of members
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        updatedAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Last update timestamp
      required:
        - id
        - name
        - slug
        - role
        - memberCount
        - createdAt
        - updatedAt
    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
          example: Acme Corporation
          description: Organization name
          minLength: 1
          maxLength: 100
        logo:
          type: string
          example: https://example.com/logo.png
          description: Organization logo URL
    MemberUserResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: User ID
        name:
          type: string
          example: John Doe
          description: User name
          nullable: true
        email:
          type: string
          example: john@example.com
          description: User email
        image:
          type: string
          example: https://example.com/avatar.png
          description: User avatar URL
          nullable: true
      required:
        - id
        - email
    MemberResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Membership ID
        role:
          type: string
          example: owner
          description: Member role
          enum:
            - owner
            - admin
            - member
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Join timestamp
        user:
          $ref: '#/components/schemas/MemberUserResponse'
      required:
        - id
        - role
        - createdAt
        - user
    UpdateMemberRoleDto:
      type: object
      properties:
        role:
          type: string
          example: admin
          description: New role for the member
          enum:
            - owner
            - admin
            - member
      required:
        - role
    InviteMemberDto:
      type: object
      properties:
        email:
          type: string
          example: john@example.com
          description: Email address of the user to invite
          format: email
        role:
          type: string
          example: member
          description: Role to assign to the invited user
          enum:
            - admin
            - member
      required:
        - email
        - role
    OrganizationSummaryResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Organization ID
        name:
          type: string
          example: Acme Inc
          description: Organization name
        slug:
          type: string
          example: acme-inc
          description: Organization slug
      required:
        - id
        - name
        - slug
    InvitationResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Invitation ID
        email:
          type: string
          example: john@example.com
          description: Invitee email
        role:
          type: string
          example: member
          description: Role to assign
          enum:
            - admin
            - member
        status:
          type: string
          example: pending
          description: Invitation status
          enum:
            - pending
            - accepted
            - rejected
            - cancelled
        expiresAt:
          format: date-time
          type: string
          example: '2026-10-26T10:00:00Z'
          description: Expiration timestamp
        createdAt:
          format: date-time
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        organization:
          $ref: '#/components/schemas/OrganizationSummaryResponse'
      required:
        - id
        - email
        - role
        - status
        - expiresAt
        - createdAt
    CreateProjectDto:
      type: object
      properties:
        name:
          type: string
          example: My Project
          description: Project name
          minLength: 1
          maxLength: 255
        slug:
          type: string
          example: my-project
          description: Unique project slug within organization (lowercase, alphanumeric, hyphens only)
          pattern: ^[a-z0-9-]+$
          minLength: 1
          maxLength: 100
        description:
          type: string
          example: This is my project description
          description: Project description
          maxLength: 500
      required:
        - name
        - slug
    ProjectStats:
      type: object
      properties:
        repositoryCount:
          type: number
          example: 5
          description: Number of repositories
        workflowRunCount:
          type: number
          example: 12
          description: Number of workflow runs
      required:
        - repositoryCount
        - workflowRunCount
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          example: uuid-here
          description: Project ID
        organizationId:
          type: string
          example: uuid-org
          description: Organization ID
        name:
          type: string
          example: My Project
          description: Project name
        slug:
          type: string
          example: my-project
          description: Project slug
        description:
          type: string
          example: Project description
          description: Project description
          nullable: true
        stats:
          description: Project statistics
          allOf:
            - $ref: '#/components/schemas/ProjectStats'
        createdAt:
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Creation timestamp
        updatedAt:
          type: string
          example: '2024-10-24T10:00:00Z'
          description: Last update timestamp
      required:
        - id
        - organizationId
        - name
        - slug
        - stats
        - createdAt
        - updatedAt
    PaginatedProjectsResponse:
      type: object
      properties:
        items:
          description: List of projects
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        total:
          type: number
          example: 100
          description: Total number of projects
        page:
          type: number
          example: 1
          description: Current page number
        limit:
          type: number
          example: 10
          description: Items per page
        totalPages:
          type: number
          example: 10
          description: Total number of pages
      required:
        - items
        - total
        - page
        - limit
        - totalPages
