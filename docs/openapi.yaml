        '404':
          description: Workflow run not found
      security: *ref_5
      summary: Get workflow run steps
      tags: *ref_6
  /api/workflows/runs/{runId}/events:
    get:
      description: Retrieves paginated event history for a workflow run
      operationId: WorkflowsController_getEvents
      parameters:
        - name: runId
          required: true
          in: path
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Number of events to return
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: offset
          required: false
          in: query
          description: Number of events to skip
          schema:
            minimum: 0
            default: 0
            type: number
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventsResponseDto'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - no access to this workflow
        '404':
          description: Workflow run not found
      security: *ref_5
      summary: Get workflow events
      tags: *ref_6
  /api/workflows/runs/{runId}/artifacts:
    get:
      description: Retrieves metadata for all artifacts generated by a workflow run
      operationId: WorkflowsController_listArtifacts
      parameters:
        - name: runId
          required: true
