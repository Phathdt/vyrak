host:
  port: 3000

database:
  url: replace_me

redis:
  url: replace_me

git:
  github_app:
    app_id: replace_me
    installation_id: replace_me
    # private_key: replace_me
    private_key_path: /var/secrets/github-app.pem
  user_name: vyrak-bot
  user_email: vyrak-bot@users.noreply.github.com

worker:
  chat_concurrency: 5
  execution_concurrency: 1

log:
  level: info
  enable_json_format: true

workspace:
  mode: worktree
  main_repos_path: /var/vyrak/repos
  workspaces_path: /var/vyrak/workspaces
  cleanup_on_success: true
  cleanup_on_failure: false
  worktree:
    base_branch: main
    branch_prefix: workflow/
    auto_fetch: true
    auto_cleanup_branch: true

anthropic:
  api_key: replace_me
  model: replace_me
  api_url: ''
  auth_scheme: x-api-key
