host:
  port: 3000

database:
  url: replace_me

redis:
  url: replace_me

jwt:
  secret: replace_me
  expiry: 24h

s3:
  endpoint: replace_me
  region: us-east-1
  bucket: vyrak-artifacts
  access_key_id: replace_me
  secret_access_key: replace_me
  force_path_style: true

git:
  github_app:
    app_id: replace_me
    installation_id: replace_me
    private_key: replace_me
    # private_key_path: /path/to/key.pem
  user_name: vyrak-bot
  user_email: vyrak-bot@users.noreply.github.com

worker:
  chat_concurrency: 5
  execution_concurrency: 1

log:
  level: info
  enable_json_format: false

agent_runtime:
  use_fake_agent: false
  claude_cli_path: claude

workspace:
  mode: worktree
  main_repos_path: /var/vyrak/repos
  workspaces_path: /tmp/vyrak-workspaces
  cleanup_on_success: true
  cleanup_on_failure: false
  worktree:
    base_branch: main
    branch_prefix: workflow/
    auto_fetch: true
    auto_cleanup_branch: true

frontend_url: replace_me

anthropic:
  api_key: replace_me
  model: replace_me
  api_url: ''
  auth_scheme: x-api-key
